appId: com.opendirect.app
productName: OpenDirect
copyright: Copyright © 2026 OpenDirect
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
# The renderer is a static Next.js export built by the `web` workspace. It is
# copied beside app.asar rather than into it, so `resolveRendererDirectory()`
# finds it at `<resources>/web` (see src/main/resolve.ts).
extraResources:
  - from: ../web/out
    to: web
asarUnpack:
  - "**/*.node"
  # sharp loads its libvips binary from sibling `@img/*` packages by path, which
  # only works outside the asar.
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
# better-sqlite3 is a native module and must be compiled against Electron's ABI,
# not Node's. This is the default, but it is spelled out because the app cannot
# start without it: electron-builder runs the rebuild for the target Electron
# version while packaging, and `pnpm --filter @opendirect/desktop rebuild:native`
# (electron-builder install-app-deps) does the same for a local dev run.
npmRebuild: true
publish:
  provider: github
  owner: venkatesh-sekar
  repo: opendirect
mac:
  category: public.app-category.graphics-design
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
win:
  target:
    - target: nsis
      arch: [x64, arm64]
linux:
  target: [AppImage, deb]
  category: Graphics
  # Without this the binary is named after the scoped package (`@opendirectdesktop`).
  executableName: opendirect
  maintainer: OpenDirect <releases@opendirect.app>
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
