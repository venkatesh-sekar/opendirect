name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# electron-builder creates/updates the GitHub Release and uploads installers
# plus the latest*.yml feeds electron-updater polls.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.18, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Builds the Next.js static export that electron-builder copies into
      # the app's resources, then the Electron main/preload bundles.
      - run: pnpm build
      - name: Build and publish desktop app
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS Developer ID certificate (base64 .p12) + notarization creds.
          # electron-builder >= 24 notarizes automatically when these are set.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code-signing certificate (base64 .pfx).
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        # An unset secret still arrives as an empty string, and electron-builder
        # treats an empty CSC_LINK as a path (the working directory) and fails.
        # Drop the empty ones so a release without secrets still builds.
        #
        # Without a Developer ID certificate the macOS app is ad-hoc signed
        # instead of left unsigned: an unsigned download is reported as
        # "damaged" with no way past it, while an ad-hoc one gets the ordinary
        # unidentified-developer prompt. Adding the secrets switches this off.
        shell: bash
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          signing=()
          if [ "$RUNNER_OS" = macOS ] && [ -z "${CSC_LINK:-}" ]; then
            signing=(-c.mac.identity=-)
          fi
          pnpm exec electron-builder --publish always "${signing[@]}"
